name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Lint, typecheck, pruebas y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      - name: El build no contiene claves secretas
        # Busca claves completas, no solo el prefijo: supabase-js incluye el
        # texto "sb_secret_" para reconocer tipos de clave.
        # Las tres variantes base64 corresponden a "service_role" dentro de un JWT.
        run: |
          if grep -rEl "sb_secret_[A-Za-z0-9_-]{20,}|eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]*(c2VydmljZV9yb2xl|NlcnZpY2Vfcm9sZ|zZXJ2aWNlX3JvbG)" dist/; then
            echo "Se encontró una posible clave secreta en el build" >&2
            exit 1
          fi

  db:
    name: Migraciones y pruebas de base de datos (RLS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx supabase db start
      - run: npx supabase test db
      - name: Ventas simultáneas no descuadran el stock
        run: npm run db:test:concurrencia
